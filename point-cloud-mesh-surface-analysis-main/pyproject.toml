[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "point-cloud-mesh-surface-analysis"
version = "0.1.0"
description = "Industrial point cloud preprocessing, meshing, and surface analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3.0",
  "scipy>=1.17,<2.0",
  "pyvista>=0.48,<0.49",
  "trimesh>=4.12,<5.0"
]

[project.scripts]
pcmsa = "point_cloud_mesh_surface_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]